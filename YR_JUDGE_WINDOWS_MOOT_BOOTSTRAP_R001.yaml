schema: YR_JUDGE_WINDOWS_MOOT_BOOTSTRAP_R001
document_id: YR-DOC-JUDGE-WINDOWS-BOOTSTRAP-20261027-R001
issued_jst: '2026-10-27'
status: R010_PUBLIC_SANITIZED_SETUP_DERIVATIVE
priority: P1_JUDGE_USABILITY
executor: CODEX_CLI_OR_CLAUDE_CODE_ON_JUDGE_HOST
language: EN_PRIMARY_JA_SUPPLEMENT
objective: 'Treat Windows installation as the first demonstrable engineering work order. Inspect the actual
  host, resolve declared dependencies, install the sealed Code_CLI candidate without changing existing
  CAD or other software, run credential-free Track 3 fixtures, then inspect EEA and public GPL Core as
  separately pinned read-only references. Produce a Moot projection and verifiable receipts for each step,
  without requiring an installed Moot engine.

  '
principles:
- COTS_TERMINAL_BLOCK_FIRST
- DO_NOT_CONFUSE_CAPABILITY_WITH_AUTHORITY
- ITEM_NAME_IS_NOT_STATE
- DEPENDENCY_IS_NOT_VALUE
- EEA_DRAFT_IS_NOT_CANONICAL_ADOPTION
- SOURCE_REFERENCE_IS_NOT_RUNTIME_AUTHORIZATION
- LOCAL_HOLD_IS_NOT_GLOBAL_STOP
- PROVIDER_REPLAY_IS_NOT_NEW_LIVE_INFERENCE
- NEVER_UPGRADE_UNKNOWN_TO_PASS
- NO_UNGROUNDED_FOURTH_RUN
- ALL_FAILURES_AND_ORIGINAL_BYTES_RETAINED
pinned_public_references:
  eea:
    repo: https://github.com/Yamrail/EEA
