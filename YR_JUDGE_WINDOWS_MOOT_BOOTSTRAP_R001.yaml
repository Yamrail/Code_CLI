    distribution: IF_BUNDLED_KEEP_SEPARATE_COPYRIGHT_SOURCE_AND_GPL_NOTICES
    run_scope: READ_ONLY_TEXT_SPEC_NO_AUTOMATIC_PROMPT_INJECTION
reference_snapshot_strategy:
  package_builder: 'Before public release, inspect EEA/LICENSE.md and GPL Core GPL notices. Include unchanged
    source snapshots in a distinct read-only reference/ subtree only within confirmed distribution authority.
    Pin all source commits and record SHA256 of each member; do not auto-import their text into agent
    system prompts or the current private runtime.

    '
  judge_first_choice: BUNDLED_PINNED_REFERENCE_SNAPSHOT_IF_AUTHORIZED_AND_AVAILABLE
  judge_second_choice: FETCH_PUBLIC_PINNED_REPO_WITH_STANDARD_GIT_IF_NETWORK_AVAILABLE
  judge_no_reference: PINNED_STATIC_REFERENCE_ONLY_BASE_DEMO_CONTINUES
  no_hidden_internet_requirement_for_core_demo: true
  original_public_source_is_not_canonical_workledger: true
reviewer_boundary:
  operating_system: WINDOWS_10_OR_11_X64_MEASURE_NOT_ASSUME
  agent_choices:
  - Codex_CLI
  - Claude_Code
  - HUMAN_TERMINAL
  agent_is_not_required_for_default_sample: true
  no_cloud_api_required_for_default_sample: true
  no_github_access_required_after_authorized_offline_bundle_is_present: true
  use_powershell: true
  enable_execution_policy_bypass: false
  prefer_existing_python: CPYTHON_3_12_X64
  prefer_existing_node: NODE_24_19_0_IF_COMPATIBLE
  python_base_minimum: '3.11'
  offline_wheelhouse_python: '3.12'
  allow_other_node_versions: ONLY_AFTER_VERSIONED_SMOKE_TEST
  fallback_principle: REUSE_COTS_OR_PORTABLE_VERIFIED_RUNTIME
  do_not_install_global_dependencies_unnecessarily: true
  do_not_modify_existing_cad_apps_projects_registry_or_services: true
  avoid_windows_long_paths: true
moot_contract:
  meaning: 'The register is an evidence-bound dependency and closure plan. It is not a Kanban board, an
    independent canonical ledger, or a claim that the judge has a proprietary YamRail Moot tool installed.

    '
  item_fields:
  - moot_id
  - item_name
  - initial_state
  - dependency_edges
  - observed_fact
  - evidence_refs
  - closure_condition
  - unresolved_fields
  initial_state_vocabulary:
  - UNKNOWN
  - HOLD
  - ACTIVE
  - PASS
  - FAIL
  - NOT_EXECUTED
  permitted_edge_types:
  - HARD_DEPENDENCY
  - CURRENT_ROUTE_ONLY
  output_projection: INSTALL_MOOT_RESULT.json
  state_writer: JUDGE_LOCAL_NONCANONICAL_RECEIPT_ONLY
  canonical_writer: EXISTING_INGRIDGE_WORKLEDGER_WHEN_RUNNING
  no_moot_engine_needed: true
  no_automatic_human_gate_approval: true
  state_rules:
  - Every node begins UNKNOWN until observed on this host.
  - HARD_DEPENDENCY blocks only its dependent route when unmet.
  - CURRENT_ROUTE_ONLY may HOLD without stopping an independent route.
  - Keep observed version, path, result, and source digest separate from state.
  - A package hash verifies bytes, not trust, safety, or human approval.
  - Never turn a referenced EEA or GPL Core document into runtime authority.
