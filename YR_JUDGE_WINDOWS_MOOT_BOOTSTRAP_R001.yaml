execution_sequence:
  W00_inventory:
    required: true
    instructions:
    - Record OS, architecture, free disk, cwd, Python, Node, Git and agent availability.
    - Use existing COTS commands; do not search indefinitely for new tools.
    - Never read or copy existing Codex/Claude secrets into the package.
    - Classify every Moot node UNKNOWN until its actual host check completes.
  W01_unpack:
    required: true
    instructions:
    - Verify current R010 judge ZIP SHA256 before extraction.
    - Extract to a new short path with sufficient write permissions.
    - Never overwrite the CAD installation or pre-existing project files.
    - Verify the included source/Code_CLI manifest before using bundled code.
    - Preserve failed receipts and original ZIP unchanged.
  W02_runtime:
    required: true
    instructions:
    - Prefer existing Python 3.12 x64 and Node on PATH.
    - If Python 3.12 is absent, use a verified COTS installation or portable copy inside the scoped yard.
    - Do not silently replace system Python or global Node.
    - No Node binary is included; supply qualified Node or set RTA_NODE explicitly.
    - Only run the package's offline installer after verifying its wheelhouse.
  W03_base_demo:
    required: true
    cwd: source/Code_CLI
    commands_powershell:
    - py -3.12 -B yr_code.py evidence verify --manifest MANIFEST.json
    - py -3.12 -B install.py
    - .\yr-code.cmd doctor --format json
    - $env:SAMPLE_MODE = "true"
    - .\yr-code.cmd sample --all
    - .\yr-code.cmd status --format json
    inspection:
    - All three cases are real local processes with synthetic decision fixtures.
    - Native source/journal digests and STOP/readback must be preserved.
    - Unmet optional sponsors cannot block these offline steps.
    - Do not repeat completed 3RUN qualification without a new justified cause.
  W04_reference_eea:
    required_for_base_demo: false
    instructions:
    - Use an available separately pinned EEA snapshot, or fetch public exact commit if network is allowed.
    - Respect LICENSE.md; reference does not grant unrestricted redistribution rights.
    - Compare exact repo commit and record SHA256 for each inspected file.
    - Run the published 12-case work-ticket gate with Python standard library.
    - Interpret T1/T6 PASS, T2/T3/T4/T5 and T7-T12 expected HOLD/BLOCKED separately.
    - The gate's --receipt covers one pass case, not all 12 cases; retain stdout to evidence the full
      set.
    command_powershell: py -3.12 -B tools/yamrail_ai_work_ticket_gate.py --project-root . --run-fixtures
      --validate-exemplar
    cwd: reference/EEA
  W05_reference_gpl_core:
    required_for_base_demo: false
    instructions:
    - Use the pinned public repository and read Core Lite 0.7.0, then Core Full 0.6.7.
    - Compare README license claims and shipped notices before redistributing copies.
    - Treat GPL Core as independent historical/public design reference, not a runtime policy upgrade.
    - Do not copy full Core text into an agent system prompt or claim runtime model control.
    cwd: reference/GPLCore
  W06_optional_api:
    required_for_base_demo: false
    live_probe_default: NOT_EXECUTED
    model: gpt-6.1-sol
    provider: OPENAI
    method: COTS_RESPONSES_API_OR_EXISTING_CODEX_CLI_LOGIN
    route_precedence:
    - codex login status (if Codex is installed; do not extract its auth secrets)
    - Codex read-only one-shot using its existing authenticated session, if supported
    - OPENAI_API_KEY scoped host environment variable
    - Human foreground entry through the included API probe
    note: 'A Claude Code login is not an OpenAI API key. An existing Codex OAuth login is not itself a
      readable API key for a separate Python REST client.

      '
    provided_snippet: OPENAI_API_PROBE.py
    authorization: EXPLICIT_HUMAN_LIVE_GATE_ONLY
    safeguards:
    - No API call during setup, archive verification, EEA checks, or sample fixtures.
    - No automatic paid request, key minting, or credential copying.
    - One synthetic request after explicit --live and human confirmation.
    - Do not automatically retry ambiguous completion or consume another attempt.
    - No substitution if preferred model is unavailable.
    - Never print secret, authorization header, or external error body.
  W07_acceptance:
    required: true
    instructions:
    - Write INSTALL_MOOT_RESULT.json and HOST_INVENTORY.json from actual observations.
    - Report pass/hold/unknown per item; do not fabricate a new canonical WorkLedger.
    - Record manifest hash, current run hashes, and source attribution.
    - Clearly label replay, synthetic, executed local work, and live provider calls.
    - Show the reviewer where to find STOP/RESUME and all three case outputs.
    - Await separate Human submission/publication authority.
hold_policy:
  no_network: PINNED_STATIC_REFERENCE_ONLY_NO_HOLD_BASE_DEMO_CONTINUES
  no_agent_cli: MANUAL_POWERSHELL_IS_ALLOWED_FOR_BASE_DEMO
  missing_python: ONLY_REQUIRED_INSTALL_ROUTE_HOLD_OR_APPROVED_PORTABLE_PREP
  missing_node: WORLD_MODEL_ROUTE_HOLD_NO_FAKE_PASS
  missing_secret: OPTIONAL_API_MOOT_HOLD_BASE_DEMO_CONTINUES
  model_401_403: LOCAL_AUTH_OR_ENTITLEMENT_HOLD_NO_AUTO_KEY_ROTATION
  ambiguous_provider_effect: UNKNOWN_COMPLETION_NO_AUTOMATIC_RETRY
  source_hash_mismatch: STOP_AFFECTED_SOURCE_EXECUTION_AND_RETAIN_FAILURE
  failed_synthetic_case: RETAIN_EXACT_FAILURE_AND_FIX_CAUSE_BEFORE_RETEST
  unknown_source_rights: DO_NOT_REDISTRIBUTE_UNVERIFIED_MATERIAL
