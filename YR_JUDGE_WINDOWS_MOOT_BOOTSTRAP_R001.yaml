- ARCHIVE_VERIFICATION.json
- RUNTIME_DISCOVERY.json
- CODECLI_INSTALL_RECEIPT.json
- CODECLI_DOCTOR.json
- SAMPLE_RUN_RECEIPT.json
- EEA_SOURCE_RECEIPT.json
- EEA_GATE_OUTPUT.txt
- GPLCORE_SOURCE_RECEIPT.json
- SOL_API_CONNECTIVITY_RECEIPT.json
- INSTALL_MOOT_RESULT.json
- JUDGE_ACCEPTANCE.json
human_gate:
