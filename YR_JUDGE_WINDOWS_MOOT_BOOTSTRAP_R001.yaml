  - PUBLIC_PUSH
  - EXTERNAL_SUBMISSION
  - CANONICAL_PROMOTION
  secret_or_account_id_in_order: NONE
  previous_host_sessions_do_not_confer_new_authority: true
handover:
  package_integration_action: 'Add this YAML, START_HERE_WINDOWS.md, OPENAI_API_PROBE.py, REFERENCE_SOURCES.json,
    FETCH_PUBLIC_REFERENCES.ps1, INSTALL_MOOT_RESULT_TEMPLATE.json and notices to the judge-facing entry
    directory. Recompute package manifest, ZIP, SHA256 and complete remote readback. Preserve the sealed
    previous ZIP unchanged and use a new candidate revision. Do not mutate existing Private or canonical
    source by implication.

    '
  external_submission: HUMAN_GATE
  completion: FIRST_UNFAMILIAR_WINDOWS_REVIEWER_CAN_RUN_THREE_CASES_AND_INSPECT_EVIDENCE
