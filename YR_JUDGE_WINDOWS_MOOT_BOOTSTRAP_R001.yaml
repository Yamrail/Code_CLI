    status: PUBLIC_DRAFT_AND_PUBLIC_REVIEW_NOT_NORMATIVE_ADOPTION
    licensing: CUSTOM_TERMS_IN_LICENSE_MD
    distribution: PIN_LINKS_FIRST_FULL_REDISTRIBUTION_REQUIRES_RIGHTS_CHECK
    run_scope: OPTIONAL_READ_ONLY_12_SYNTHETIC_TESTS
  gpl_core:
    repo: https://github.com/Yamrail/Yamrail
    commit: 0d6f1532a496c2033502d11adbebdda18b11e963
    purpose: PUBLIC_LEGACY_CORE_SPECIFICATION_NOT_PRIVATE_RUNTIME
    files:
    - README.md
    - packages/core-engine/src/prompts/yamrail_core_v0.7.0_lite.yaml
    - packages/core-engine/src/prompts/yamrail_core_v0.6.7_full.yaml
    - docs/yamrail_guidebook_v0.7.1.txt
    - docs/yamrail_appendix_b_v0.7.1.txt
    status: PUBLIC_REFERENCE
